<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="description" content="Complete this product review form to share your feedback, rating, installation date, and useful features about a product.">
    <meta name="author" content="Patricia Harris">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review Form</h1>
    </header>
    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" selected disabled>Select a Product ...</option>
            </select>
            <fieldset>
                <legend>Overall Rating</legend>
                <input type="radio" id="star1" name="rating" value="1" required>
                <label for="star1">☆</label>

                <input type="radio" id="star2" name="rating" value="2" required>
                <label for="star2">☆☆</label>

                <input type="radio" id="star3" name="rating" value="3" required>
                <label for="star3">☆☆☆</label>

                <input type="radio" id="star4" name="rating" value="4" required>
                <label for="star4">☆☆☆☆</label>

                <input type="radio" id="star5" name="rating" value="5" required>
                <label for="star5">☆☆☆☆☆</label>

                    
             </fieldset>
            

            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>
            <fieldset>
                <legend>Which features did you find in the product?(Check all the that apply)</legend>

                <input type="checkbox" id="durability" name="features" value="Durability">
                <label for="durability">Durability</label><br>

                <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                <label for="easeOfUse">Ease of Use</label><br>

                <input type="checkbox" id="performance" name="features" value="Performance">
                <label for="performance">Performance</label><br>

                <input type="checkbox" id="design" name="features" value="Design">
                <label for="design">Design</label>
            </fieldset>
            

            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review"></textarea>
            <label for="username">User Name (Optional)</label>
            <input type="text" id="username" name="username">
            <input type="submit" value="Post Review">
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> Patricia Harris | Chile</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
